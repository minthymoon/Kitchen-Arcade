<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-a-Veggie</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥕</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-wood-dark">

  <div id="site-navbar" data-home="../" data-title="Whack-a-Veggie"></div>

  <div id="best-sign">
    <div class="sign-rope"></div>
    <div class="sign-board">
      <span class="sign-label">Best</span>
      <span id="best-score">0</span>
    </div>
  </div>

  <div id="left-signs">
    <div class="side-sign" id="speed-sign">
      <div class="sign-rope"></div>
      <div class="sign-board">
        <span class="sign-label">Speed</span>
      </div>
      <div class="option-buttons vertical">
        <button type="button" class="option-btn" data-speed="easy">Easy</button>
        <button type="button" class="option-btn selected" data-speed="medium">Medium</button>
        <button type="button" class="option-btn" data-speed="hard">Hard</button>
      </div>
    </div>

    <div class="side-sign" id="time-sign">
      <div class="sign-rope"></div>
      <div class="sign-board">
        <span class="sign-label">Time</span>
      </div>
      <div class="option-buttons vertical">
        <button type="button" class="option-btn" data-time="15">15s</button>
        <button type="button" class="option-btn selected" data-time="30">30s</button>
        <button type="button" class="option-btn" data-time="60">60s</button>
      </div>
    </div>
  </div>

  <main class="game-wrapper">

    <div id="stats-container">
      <div class="stat-block">
        <span class="stat-label">Score</span>
        <span id="score" class="stat-value">0</span>
      </div>
      <div class="stat-block">
        <span class="stat-label">Time</span>
        <span id="time-left" class="stat-value">30</span>
      </div>
    </div>

    <button id="menu-toggle-btn" type="button" aria-label="Game options">
      <span></span><span></span><span></span>
    </button>

    <div id="plot">
      <!-- 9 holes injected by app.js -->
    </div>

    <button id="start-btn" class="btn btn-primary">Start</button>
    <button id="stop-btn" class="btn btn-primary" hidden>Stop</button>

  </main>

  <div id="mobile-options-overlay" hidden>
    <div class="overlay-panel">
      <button id="close-menu-btn" type="button" aria-label="Close options">&times;</button>

      <div class="option-group">
        <span class="option-label">Speed</span>
        <div class="option-buttons">
          <button type="button" class="option-btn" data-speed="easy">Easy</button>
          <button type="button" class="option-btn selected" data-speed="medium">Medium</button>
          <button type="button" class="option-btn" data-speed="hard">Hard</button>
        </div>
      </div>

      <div class="option-group">
        <span class="option-label">Time</span>
        <div class="option-buttons">
          <button type="button" class="option-btn" data-time="15">15s</button>
          <button type="button" class="option-btn selected" data-time="30">30s</button>
          <button type="button" class="option-btn" data-time="60">60s</button>
        </div>
      </div>
    </div>
  </div>

  <div id="end-overlay" hidden>
    <div class="end-card">
      <h2>Time's up!</h2>
      <p>You whacked <span id="final-score">0</span> veggies.</p>
      <button id="close-end-btn" class="btn btn-primary">Close</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="../common/js/navbar.js" defer></script>
</body>
</html>
