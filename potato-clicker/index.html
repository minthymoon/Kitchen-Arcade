<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potato Clicker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥔</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-wood-dark">

   <div id="site-navbar" data-home="../" data-title="Potato Clicker"></div>

<div id="best-sign">
  <div class="sign-rope"></div>
  <div class="sign-board">
    <span class="sign-label">Best</span>
    <span id="best-count">0</span>
  </div>
</div>

<main class="game-wrapper">
 
 
  <div id="count-container">
    <span id="count-label">Clicks:</span> <span id="count">0</span>
  </div>

 
  <img id="potato" src="assets/potato1.png" alt="Potato">


  <button id="clear-btn" class="btn btn-primary">Clear</button>
</main>

  <script src="js/app.js"></script>
  <script src="../common/js/navbar.js" defer></script>
</body>
</html>
